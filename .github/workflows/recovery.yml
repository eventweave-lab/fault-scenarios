name: Recovery verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fault-scenarios
      - uses: actions/checkout@v4
        with:
          repository: eventweave-lab/checkpoint-store
          path: checkpoint-store
      - uses: actions/checkout@v4
        with:
          repository: eventweave-lab/collector
          path: collector
      - uses: actions/checkout@v4
        with:
          repository: eventweave-lab/replay-console
          path: replay-console
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s fault-scenarios -v
